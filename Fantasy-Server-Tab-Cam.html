:root{
  --bg:#0a0a0a;
  --surface:#131313;
  --surface2:#1a1d1a;
  --line:#262b26;
  --text:#f5f7f5;
  --muted:#9ca79f;
  --green:#00ff88;
  --red:#ff4d5d;
  --safe-area-inset-top: env(safe-area-inset-top, 0px)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:wait
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(circle at 70% -100px, rgba(0,255,136,.12), transparent 38%), var(--bg)
}

.topbar{
  max-width:1440px;
  margin:auto;
  padding:18px 24px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  border-bottom:1px solid #1b1b1b;
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:rgba(10,10,10,.92);
  backdrop-filter:blur(16px)
}

.brand{
  display:flex;
  gap:11px;
  align-items:center
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--green);
  color:#032012;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:22px
}

.brand strong{
  font-size:16px;
  letter-spacing:.06em
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.22em;
  margin-top:2px
}

.mode-switch{
  display:flex;
  background:#171717;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px
}

.mode-switch button{
  border:0;
  background:transparent;
  color:#b8beb8;
  border-radius:999px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800
}

.mode-switch button.active{
  background:var(--green);
  color:#03130a
}

.live-mini{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#666
}

.dot.on{
  background:var(--green);
  box-shadow:0 0 0 5px rgba(0,255,136,.14)
}

main{
  max-width:1440px;
  margin:auto;
  padding:28px 24px 16px
}

.tab-layout{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(310px,.8fr);
  gap:22px;
  align-items:start
}

.eyebrow{
  display:flex;
  gap:16px;
  color:var(--green);
  font-size:11px;
  font-weight:900;
  letter-spacing:.16em
}

.eyebrow span:last-child{
  color:#687068
}

.tab-hero h1{
  font-size:clamp(38px,5vw,68px);
  line-height:.98;
  margin:16px 0 10px;
  letter-spacing:-.04em
}

.tab-hero h1 em{
  color:var(--green);
  font-style:normal
}

.tab-hero>p{
  color:var(--muted);
  max-width:720px;
  line-height:1.6;
  margin:0 0 22px
}

.preview-wrap{
  max-width:980px
}

.preview{
  aspect-ratio:16/9;
  background:#000;
  border:1px solid #2b2b2b;
  border-radius:22px;
  overflow:hidden;
  position:relative
}

.preview video{
  width:100%;
  height:100%;
  -o-object-fit:cover;
     object-fit:cover;
  display:none
}

.preview video.show{
  display:block
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#6b756d;
  gap:7px;
  text-align:center;
  padding:20px
}

.placeholder strong{
  color:#d6dcd7;
  font-size:22px
}

.placeholder span{
  font-size:13px
}

.preview-tag{
  position:absolute;
  left:16px;
  top:16px;
  background:rgba(0,0,0,.68);
  border:1px solid #333;
  padding:7px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.12em;
  display:flex;
  gap:7px;
  align-items:center
}

.live-dot,.wait-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green)
}

.wait-dot{
  background:#666
}

.corner{
  position:absolute;
  width:28px;
  height:28px;
  border:2px solid rgba(0,255,136,.8)
}

.tl{
  left:12px;
  bottom:12px;
  border-right:0;
  border-top:0
}

.tr{
  right:12px;
  bottom:12px;
  border-left:0;
  border-top:0
}

.bl{
  left:12px;
  top:12px;
  border-right:0;
  border-bottom:0
}

.br{
  right:12px;
  top:12px;
  border-left:0;
  border-bottom:0
}

.scan{
  position:absolute;
  left:0;
  right:0;
  height:2px;
  background:rgba(0,255,136,.5);
  box-shadow:0 0 18px var(--green);
  animation:scan 2.4s ease-in-out infinite alternate
}

@keyframes scan{
  from{
    top:8%
  }

  to{
    top:88%
  }
}

.status-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-top:14px;
  flex-wrap:wrap
}

.pill{
  border:1px solid #2d362e;
  background:#111812;
  color:#d7e5da;
  border-radius:999px;
  padding:10px 14px;
  font-weight:800;
  font-size:14px
}

.pill.on{
  border-color:#00ff8866;
  background:#092115;
  color:#bfffdc
}

.fps-box{
  display:flex;
  align-items:center;
  gap:6px;
  color:#c8d0c8;
  font-size:13px
}

.fps-box b{
  font-size:17px;
  color:white
}

.fps-box i{
  color:#444;
  font-style:normal
}

.main-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap
}

.start-btn{
  border:0;
  background:var(--green);
  color:#03130a;
  border-radius:12px;
  padding:15px 22px;
  font-weight:900;
  font-size:17px;
  box-shadow:0 8px 30px rgba(0,255,136,.2)
}

.stop-btn,.flip-btn{
  border:1px solid #303830;
  background:#191919;
  color:white;
  border-radius:12px;
  padding:15px 18px;
  font-weight:800;
  display:flex;
  gap:8px;
  align-items:center
}

.error{
  margin-top:13px;
  background:#2a1215;
  border:1px solid #5b2228;
  color:#ffb9c0;
  border-radius:12px;
  padding:13px 15px;
  line-height:1.5;
  font-size:14px
}

.control-panel{
  background:#121312;
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  position:sticky;
  top:84px
}

.panel-title{
  display:flex;
  gap:10px;
  align-items:center;
  color:var(--green);
  padding-bottom:16px;
  border-bottom:1px solid var(--line)
}

.panel-title strong{
  display:block;
  color:white;
  font-size:16px
}

.panel-title span{
  color:var(--muted);
  font-size:12px
}

.field{
  margin-top:18px
}

.field label{
  font-size:13px;
  font-weight:800;
  display:block;
  margin-bottom:9px
}

.field small{
  color:#788079;
  font-size:12px;
  line-height:1.5;
  display:block;
  margin-top:8px
}

.segmented{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#0b0b0b;
  border:1px solid var(--line);
  border-radius:10px;
  padding:4px
}

.segmented button{
  border:0;
  background:transparent;
  color:#9ba39c;
  border-radius:7px;
  padding:10px;
  font-weight:800
}

.segmented button.active{
  background:var(--green);
  color:#03130a
}

.field input[type=text],.field input:not(.range){
  width:100%;
  background:#090909;
  border:1px solid #2b2b2b;
  color:white;
  border-radius:10px;
  padding:12px
}

.range-head{
  display:flex;
  justify-content:space-between
}

.range-head b{
  color:var(--green)
}

.range{
  width:100%;
  accent-color:var(--green)
}

.frame-card{
  margin-top:20px;
  background:#090909;
  border:1px solid #292c29;
  border-radius:14px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px
}

.frame-card span{
  display:block;
  color:#84908a;
  font-size:11px
}

.frame-card strong{
  font-size:14px
}

.frame-card img{
  width:112px;
  height:63px;
  -o-object-fit:cover;
     object-fit:cover;
  border-radius:8px;
  border:1px solid #333
}

.thumb-empty{
  width:112px;
  height:63px;
  border:1px dashed #333;
  border-radius:8px;
  display:grid;
  place-items:center;
  color:#6e756f;
  font-size:11px;
  text-align:center;
  padding:6px
}

.info-card{
  margin-top:18px;
  background:#092114;
  border:1px solid #173c29;
  border-radius:14px;
  padding:16px;
  display:flex;
  gap:12px;
  color:var(--green)
}

.info-card strong{
  color:white;
  display:block
}

.info-card p{
  color:#c6d4ca;
  font-size:13px;
  line-height:1.55;
  margin:6px 0
}

.info-card p b{
  color:var(--green)
}

.info-card span{
  color:#789085;
  font-size:12px
}

.pc-layout{
  max-width:1240px;
  margin:auto
}

.pc-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  flex-wrap:wrap
}

.pc-head h1{
  font-size:clamp(34px,4vw,54px);
  margin:12px 0 8px;
  letter-spacing:-.03em
}

.pc-head p{
  color:var(--muted);
  margin:0
}

.pc-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.pc-actions button{
  border:1px solid #303830;
  background:#171717;
  color:#eee;
  border-radius:10px;
  padding:11px 14px;
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:800
}

.pc-actions .record.on{
  border-color:#ff4d5d;
  color:#ffc8cd
}

.red-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#5c5c5c
}

.record.on .red-dot{
  background:var(--red);
  box-shadow:0 0 0 4px rgba(255,77,93,.18)
}

.spin{
  animation:spin .6s linear
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.connect-bar{
  margin-top:26px;
  background:linear-gradient(90deg,#0d2b1d,#121212);
  border:1px solid #214a33;
  border-radius:14px;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap
}

.connect-bar strong{
  display:block
}

.connect-bar span{
  color:#90a097;
  font-size:13px
}

.connect-bar button{
  border:0;
  background:var(--green);
  color:#03130a;
  border-radius:10px;
  padding:11px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:900
}

.note{
  margin-top:12px;
  background:#151713;
  border:1px solid #30352e;
  border-radius:10px;
  padding:12px 14px;
  color:#d9e1d8;
  font-size:14px
}

.camera-grid{
  display:grid;
  grid-template-columns:1.65fr 1fr;
  gap:16px;
  margin-top:16px
}

.cam-card{
  background:#121312;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden
}

.cam-card header{
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line)
}

.cam-id{
  display:flex;
  gap:11px;
  align-items:center
}

.cam-id>span{
  width:36px;
  height:36px;
  border-radius:9px;
  background:#22261f;
  display:grid;
  place-items:center;
  color:var(--green);
  font-weight:900
}

.cam-id strong{
  display:block
}

.cam-id small{
  color:#85908a;
  font-size:12px
}

.cam-state{
  font-size:11px;
  font-weight:900;
  letter-spacing:.1em;
  color:#777
}

.cam-state.live{
  color:var(--green)
}

.cam-view{
  aspect-ratio:16/9;
  background:#000;
  position:relative;
  overflow:hidden
}

.cam-view video{
  width:100%;
  height:100%;
  -o-object-fit:cover;
     object-fit:cover;
  display:none
}

.cam-view video.show{
  display:block
}

.rec-tag{
  position:absolute;
  top:13px;
  left:13px;
  background:rgba(0,0,0,.65);
  padding:6px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:900
}

.cam-view.empty{
  display:grid;
  place-items:center
}

.empty-copy{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:7px;
  color:#70796f;
  padding:22px
}

.empty-copy strong{
  color:#cfd6cf
}

.empty-copy span{
  font-size:13px;
  line-height:1.5
}

.empty-copy button{
  margin-top:8px;
  border:1px solid #303830;
  background:#1a1a1a;
  color:#d9ddd9;
  border-radius:8px;
  padding:9px 12px
}

.cam-card footer{
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  color:#88928c;
  font-size:12px
}

.cam-card footer span{
  display:flex;
  align-items:center;
  gap:5px
}

.demo{
  position:absolute;
  inset:0;
  background:#050706
}

.demo-grid{
  position:absolute;
  inset:0;
  background-image:linear-gradient(rgba(0,255,136,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.08) 1px,transparent 1px);
  background-size:36px 36px
}

.demo-dot{
  position:absolute;
  width:12px;
  height:12px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 16px var(--green);
  transition:.12s linear
}

.demo-label{
  position:absolute;
  left:18px;
  bottom:18px
}

.demo-label span{
  color:var(--green);
  font-size:10px;
  font-weight:900;
  letter-spacing:.16em
}

.demo-label strong{
  display:block;
  margin:5px 0 2px
}

.demo-label small{
  color:#829088
}

.demo-scan{
  position:absolute;
  left:0;
  right:0;
  height:1px;
  background:rgba(0,255,136,.35);
  animation:scan 2s ease-in-out infinite alternate
}

.steps{
  margin-top:18px;
  background:#121312;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px
}

.steps-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.steps-head span{
  color:#7d897f;
  font-size:13px
}

.steps ol{
  list-style:none;
  padding:0;
  margin:18px 0 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.steps li{
  display:flex;
  gap:12px;
  background:#0c0d0c;
  border:1px solid #252a25;
  border-radius:13px;
  padding:15px
}

.steps li>b{
  color:var(--green);
  font-size:22px
}

.steps li strong{
  display:block;
  margin-bottom:4px
}

.steps li span{
  color:#7f8b82;
  font-size:12px;
  line-height:1.5
}

.hidden-canvas{
  display:none
}

.bottom-note{
  max-width:1440px;
  margin:auto;
  padding:18px 24px 28px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:#646d65;
  font-size:12px;
  border-top:1px solid #1a1a1a
}

@media(max-width:820px){
  .topbar{
    padding:14px 14px 10px;
    flex-wrap:wrap
  }

  .brand small{
    display:none
  }

  .mode-switch{
    order:3;
    width:100%
  }

  .mode-switch button{
    flex:1;
    justify-content:center;
    padding:9px 8px;
    font-size:13px
  }

  .live-mini{
    display:none
  }

  main{
    padding:20px 14px 10px
  }

  .tab-layout{
    grid-template-columns:1fr
  }

  .tab-hero h1{
    font-size:42px
  }

  .control-panel{
    position:static
  }

  .camera-grid{
    grid-template-columns:1fr
  }

  .steps ol{
    grid-template-columns:1fr
  }

  .pc-head{
    align-items:start
  }

  .pc-actions{
    width:100%
  }

  .pc-actions button{
    flex:1;
    justify-content:center
  }

  .connect-bar{
    align-items:flex-start
  }

  .connect-bar button{
    width:100%;
    justify-content:center
  }

  .bottom-note{
    flex-direction:column;
    padding:16px
  }

  .frame-card img,.thumb-empty{
    width:96px
  }
}

@media(max-width:430px){
  .tab-hero h1{
    font-size:36px
  }

  .mode-switch button{
    font-size:12px
  }

  .status-row{
    align-items:flex-start
  }

  .main-actions .start-btn,.main-actions .stop-btn,.main-actions .flip-btn{
    width:100%;
    justify-content:center
  }

  .cam-card header{
    align-items:flex-start
  }

  .cam-id small{
    max-width:190px;
    display:block
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a0a0a
  }
}
